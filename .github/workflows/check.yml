# Builds pull requests and non-main branches so a broken entry is caught before merge.
name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm install (not ci): the lockfile is written on Windows and GitHub runs a
      # newer npm on Linux, which resolves a few optional packages differently.
      - run: npm install --no-audit --no-fund
      - run: npm run build
