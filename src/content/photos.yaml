# Photos live in src/assets/photos/. Files directly in that folder belong to
# Photography (and the /photography/ page). Files in a subfolder named after a
# strand belong to that strand: photos/stage/ for Stage, photos/music/ for Music.
#
# Listing a photo here is optional; it sets the description read out by
# screen readers (alt), the order, and the line under it:
#   order    lower comes first
#   caption  short text, e.g. the play
#   credit   "With the courtesy of <credit>"; "" keeps the line with the name open
#   home     true picks the (up to six) photos shown on the home page for that strand

# Stage
- id: spamalot
